# SongDock settings
#
# Edit on the Pi with:  nano ~/.config/musicdock/config.toml
# (Ctrl-O, Enter to save; Ctrl-X to exit). Changes apply at the next check
# (every 5 minutes) or the next time a player is docked.
#
# How to read this file:
#   - Each line is  group.setting = value
#   - A line starting with # is switched off: the dock uses the default shown.
#     To change one, delete the "# " at the start and edit the value.
#   - Text in quotes stays in quotes; true/false and numbers don't.
#
# Sections, in order:
#   1. REQUIRED       set these before the first sync
#   2. CHECK THESE    defaults most people keep, but look them over
#   3. OPTIONAL       extra features, all with sensible defaults
#   4. ADVANCED       change only if you know you need to


# =====================================================================
# 1. REQUIRED: set these before the first sync
# =====================================================================

# Your Navidrome server: its address as the dock can reach it, and your own
# account (plays are counted per account). The password is only used to sign
# requests, never sent as is. https needs a properly signed certificate.
# Several addresses for the same server, tried in order, also work:
# ["http://192.168.1.50:4533", "https://music.example.com"]
server.url = "http://192.168.1.50:4533"
server.username = "your-navidrome-username"
server.password = "your-navidrome-password"

# Safe hours: a daily window when the dock doesn't sync, so you can grab the
# iPod (say, for a morning commute) without waiting for a sync to finish. A
# player docked then just charges. Set it to fit your day, local time, or
# "off" for none.
sync.safe_hours = "07:00-10:00"

# Music is only copied once this is true. Leave it false for the first dock:
# the dock then only reads the iPod's plays, so you can check everything works.
# Turn it on once section 2 looks right.
device.write = false


# =====================================================================
# 2. CHECK THESE: defaults most people keep, but look them over
# =====================================================================

# What goes on the iPod: your starred songs ("starred"), and any playlist
# whose comment in Navidrome contains the tag below. To add a playlist by name
# instead: ["starred", "playlist:Road Trip"]. Use [] with a tag for playlists only.
sync.targets = ["starred"]
sync.playlist_tag = "#ipod"          # "" = don't look for tagged playlists

# The iPod playlist made from your starred songs ("" = none).
sync.favorites_playlist = "Favorites"

# How much music the dock keeps on its SD card, in GB. About 2 MB per minute
# of music. Up to ~35 on a 64 GB card; the dock also stops at 80% full.
sync.max_cache_gb = 20

# The screen: its version is printed on the back ("v4", "v3" or "v2"), and
# "light" (black on white) or "dark" (white on black).
display.model = "v4"
display.theme = "light"


# =====================================================================
# 3. OPTIONAL: extra features. Delete the "# " to change one.
# =====================================================================

# --- Lossless songs ---
# Songs in a playlist with this tag in its comment go on the iPod lossless
# (ALAC; FLAC on Rockbox) when Navidrome has them lossless. About 3x the
# space: "" turns it off, e.g. for a small iPod.
# sync.lossless_tag = "#lossless"

# --- Favorites from the iPod ---
# A song you rate this many stars on the iPod gets starred in Navidrome, once
# (0 = never). Rockbox players use their Keep playlist instead.
# sync.favorite_rating = 4

# --- When the iPod is full ---
# Normally new songs wait and the screen says PLAYER FULL. With make_room,
# the oldest music on the iPod makes way, only as much as needed.
# sync.make_room = false
#   Remove whole albums (an album's age is its newest song's), or song by song.
# sync.make_room_albums = true
#   Never remove music played, added or in a changed playlist within this
#   many months. Also decides what leaves the dock's cache first when it's full.
# sync.recent_play_months = 3

# --- Artist and album names on the iPod (Navidrome is never changed) ---
# One artist per song: the album's artist, with guests moved to the title
# ("Song (feat. B)"). false = keep the names exactly as tagged.
# sync.primary_artist = true
#   Names with a comma, & or / that are one artist, never to be split,
#   e.g. ["Now, Now", "Simon & Garfunkel"].
# sync.artist_names = []
#   One artist spelled two ways, listed under one name, as "other spelling =
#   name", e.g. ["Beatles = The Beatles"].
# sync.artist_aliases = []
#   Compilations to list as one artist: albums whose name contains the words,
#   optionally "= the name to show", e.g. ["Now That's What I Call Music",
#   "Monthly Mix = My Mixes"].
# sync.compilation_albums = []
#   An artist with this many one-song albums gets them as one album,
#   "<Artist> Singles" (0 = off).
# sync.singles_album_min = 4

# --- Updates and automatic syncing ---
# Install new SongDock releases by themselves (announced on screen 4 hours
# ahead, installed once no player is connected). false = only announce them.
# sync.auto_update = true
# An iPod left docked syncs again by itself when new music is ready
# (playback stops while it syncs).
# device.auto_resync = true
# How often the dock checks Navidrome for new music, in minutes (1-1440).
# sync.check_interval_minutes = 5

# --- Genres ---
# The iPod's Genres menu uses a built-in list of groups. To make your own,
# see genres.example.toml next to this file.


# =====================================================================
# 4. ADVANCED: change only if you know you need to
# =====================================================================

# Music format for stock iPods: "mp3" (recommended), "alac" (lossless, ~3x
# larger) or "aac" (not recommended: ffmpeg's AAC has audible artifacts).
# device.convert_to = "mp3"
# MP3 quality: "v0" (variable, best) or a constant rate like "320k".
# Changing it converts the whole cache again.
# device.mp3_quality = "v0"
# AAC rate, only with convert_to = "aac".
# device.aac_bitrate = "256k"

# A dock for Rockbox players only: "rockbox" copies music as it is on the
# server, FLAC included. Stock iPods are then refused.
# device.type = "stock_ipod"
#   Only with type = "rockbox": false converts FLAC too, for players that
#   can't play it.
# device.flac = true

# Days to keep music that left every list cached on the dock, so adding it
# back is instant (0-30). Deleted sooner if the SD card gets full.
# sync.removal_grace_days = 7
# Where the cache lives.
# sync.cache_dir = "~/musicdock/cache"
# Conversions at once: "auto" = CPU cores - 1.
# sync.workers = "auto"
# While converting a big batch, hand finished songs to a docked iPod this many
# at a time: "auto" (a twentieth of the batch, 25-500), a number, or 0 = only
# once everything is converted.
# sync.sync_batch_size = "auto"
