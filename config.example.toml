# SongDock settings. The installer copies this to
# ~/.config/musicdock/config.toml on the Pi (readable only by you); edit that
# copy with:  nano ~/.config/musicdock/config.toml
# Changes take effect at the next check (every check_interval_minutes, 5 by
# default) or the next dock.

[server]
url = "http://192.168.1.50:4533"   # your Navidrome address, as reachable from the dock.
                                   # https needs a properly signed certificate. Several
                                   # addresses for the same server, in the order to try:
                                   # ["http://192.168.1.50:4533", "https://music.example.com"]
username = "your-navidrome-username"
password = "your-navidrome-password"  # only used to sign requests; never sent as is

[sync]
targets = ["starred"]              # what to sync: "starred" and/or "playlist:<name>",
                                   # e.g. ["starred", "playlist:Road Trip"]. A song in
                                   # several lists is stored and copied once.
favorites_playlist = "Favorites"   # player playlist made from "starred" ("" = none)
playlist_tag = "#ipod"             # also sync any playlist whose Navidrome comment has
                                   # this tag (any case). "" = off. Remove the tag to unsync.
lossless_tag = "#lossless"         # songs in a playlist with this tag in its comment sync as
                                   # ALAC (FLAC on Rockbox) if the server's copy is lossless;
                                   # about 3x the space. "" = off, e.g. for a small iPod. Ignored
                                   # until the dock has synced an iPod (or, on a Rockbox-only
                                   # dock with flac = false, a Rockbox player).
primary_artist = true              # one artist per song: the album's, else the first in the
                                   # credit ("A & B" -> A), others as "(feat. B)" in the title.
                                   # On the player only.
artist_names = []                  # credits never to split, e.g. ["Now, Now"]; common ones
                                   # are already known
compilation_albums = []            # compilations to list as one artist, the songs' artists going
                                   # to their titles. Any album whose name contains the words:
                                   # ["Now That's What I Call Music",
                                   #  "Chillhop Essentials = Chillhop Releases"] (= names the artist)
cache_dir = "~/musicdock/cache"
max_cache_gb = 20                  # music cached on the dock (about 2 MB per minute);
                                   # up to ~35 on a 64 GB card. Also stops at 80% full.
workers = "auto"                   # parallel conversions: "auto" = CPU cores - 1 (min 1)
removal_grace_days = 7             # 0-30: keep tracks that left every list cached this
                                   # long (re-adding is instant); deleted oldest-first
                                   # sooner if the SD card drops below 25% free
check_interval_minutes = 5         # how often the dock checks Navidrome for new music
                                   # and sends waiting plays (1-1440). A docked iPod syncs
                                   # right after a check finds something. Takes effect by
                                   # itself within a few seconds of saving this file.
sync_batch_size = "auto"           # while converting, hand new tracks to a docked iPod in
                                   # batches as the rest still convert (Pi with 2+ cores,
                                   # e.g. Zero 2 W; a Zero W converts first anyway). "auto":
                                   # 1/20 of the run, 25 to 500 tracks each. A number = that
                                   # many; 0 = sync only once everything is converted.
safe_hours = "07:00-10:00"         # no syncs in this daily window (local time), so you
                                   # can grab the iPod in the morning. An iPod docked then
                                   # just charges; a sync running when it starts finishes
                                   # early. Either way it syncs afterwards if still docked.
                                   # "off" = no safe hours.

[device]
type = "stock_ipod"                # stock_ipod: music converted for stock iPods (MP3/ALAC);
                                   # Rockbox players get the same files. "rockbox": copy
                                   # music as-is, FLAC included, for a Rockbox-only dock
                                   # (stock iPods are then refused).
flac = true                        # only with type = "rockbox": false converts FLAC to
                                   # convert_to too, for players that can't play FLAC
                                   # (cheap MP3 players); other formats stay as they are.
                                   # A basic player in the dock's list converts Ogg, Opus
                                   # and FLAC whatever this says.
convert_to = "mp3"                 # stock iPod can't play FLAC. mp3 = LAME V0 (recommended);
                                   # alac = lossless, ~3x larger; aac = ffmpeg's encoder (artifacts)
mp3_quality = "v0"                 # v0 = variable, best (~260k avg); or constant "320k", "256k".
                                   # Changing it re-converts the cache on the next prepare run.
aac_bitrate = "256k"               # only used by convert_to = "aac"
write = false                      # false: read-only check (plays still logged);
                                   # true: full sync - copy tracks, playlists, removals
auto_resync = true                 # an iPod left docked syncs again by itself when new
                                   # music is ready (interrupts playback while docked)

[display]
theme = "light"                    # "light" (black on white) or "dark" (white on black,
                                   # e.g. for a dark case). E-ink holds either colour
                                   # without power: no extra wear. (Older configs used
                                   # invert = true for dark; that still works when no
                                   # theme is set.)
model = "v4"                       # Waveshare 2.13" e-Paper HAT version, printed on the
                                   # back of the screen: "v4" (tested), "v3" or "v2".
                                   # A V2 does a full refresh (brief flash) every update.

[genres]
# The iPod's Genres menu. Navidrome gives songs several genre tags, and the
# iPod showed every combination as its own genre. Instead, each song goes in
# one of the groups below; only the iPod's copy changes, never Navidrome.
# Order is priority: a song goes in the FIRST group with a keyword matching
# any of its tags. Keywords match whole words, ignoring case and punctuation
# ("rock" matches "alternative rock"; "pop" doesn't match "electropop").
# "release:live" matches the album's release type in Navidrome, and
# "album:chillhop" words in the album's name. Then each album takes the
# group most of its songs got. Preview the result with:
#   ~/musicdock/venv/bin/python ~/musicdock/app/dock_prepare.py --genres
unmatched = ""                     # songs no group matches: "" = their tag that the
                                   # most albums carry; or one name, e.g. "Other"

[[genres.groups]]
name = "Live Recordings"
match = ["release:live", "live"]

[[genres.groups]]
name = "Soundtracks"
match = ["release:soundtrack", "soundtrack", "score", "ost",
         "video game music", "musical", "show tunes"]

[[genres.groups]]
name = "Holiday"
match = ["christmas", "holiday", "xmas"]

[[genres.groups]]
name = "Children's"
match = ["children", "kids", "nursery", "lullaby"]

[[genres.groups]]
name = "Spoken Word"
match = ["spoken word", "comedy", "audiobook", "podcast", "poetry",
         "speech", "non music"]

[[genres.groups]]
name = "Chiptune"
match = ["chiptune", "chipstep", "bitpop", "8 bit"]

[[genres.groups]]
name = "Breakcore"
match = ["breakcore", "dariacore", "digital hardcore", "speedcore",
         "mashcore"]

[[genres.groups]]
name = "DnB"
match = ["drum and bass", "drum n bass", "dnb", "jungle", "liquid funk",
         "neurofunk"]

[[genres.groups]]
name = "Lofi / Chill"
match = ["album:chillhop", "album:lofi", "album:lo fi", "lo fi", "lofi",
         "chill", "chillout", "chillhop", "trip hop", "new age"]

[[genres.groups]]
name = "Hip-Hop"
match = ["hip hop", "hiphop", "boom bap", "rap", "trap", "grime", "drill"]

[[genres.groups]]
name = "Indie Rock"
match = ["indie rock"]

[[genres.groups]]
name = "Indie Pop"
match = ["indie pop", "dream pop", "bedroom pop", "indietronica",
         "art pop", "alternative pop"]

[[genres.groups]]
name = "Metal"
match = ["metal", "metalcore", "deathcore", "grindcore", "djent"]

[[genres.groups]]
name = "Country"
match = ["country", "bluegrass", "americana", "honky tonk"]

[[genres.groups]]
name = "Folk"
match = ["folk", "singer songwriter", "acoustic"]

[[genres.groups]]
name = "Rock"
match = ["rock", "punk", "grunge", "emo", "post hardcore", "screamo",
         "shoegaze"]

[[genres.groups]]
name = "Electronic"
match = ["electronic", "electronica", "edm", "house", "techno", "trance",
         "dubstep", "brostep", "riddim", "electro", "complextro",
         "breaks", "dance", "rave", "eurodance", "hardcore", "footwork",
         "synthwave", "future bass", "idm"]

[[genres.groups]]
name = "Pop"
match = ["pop", "electropop", "hyperpop"]

[[genres.groups]]
name = "R&B / Soul"
match = ["r&b", "rnb", "rhythm and blues", "soul", "funk", "motown",
         "disco"]

[[genres.groups]]
name = "Jazz"
match = ["jazz", "bebop", "swing", "big band", "bossa nova"]

[[genres.groups]]
name = "Blues"
match = ["blues"]

[[genres.groups]]
name = "Classical"
match = ["classical", "orchestral", "symphony", "opera", "baroque",
         "chamber music", "choral", "neoclassical"]

[[genres.groups]]
name = "Reggae"
match = ["reggae", "ska", "dub", "dancehall", "rocksteady"]

[[genres.groups]]
name = "Latin"
match = ["latin", "reggaeton", "salsa", "bachata", "cumbia", "samba",
         "tango"]

[[genres.groups]]
name = "Gospel & Christian"
match = ["gospel", "christian", "worship"]

[[genres.groups]]
